<!DOCTYPE html>
<html lang="no">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Elias sin magiske bingogenerator</title>
	<style>
		/* Light by default; Monokai when OS prefers dark. PDF output unchanged. */
		:root {
			color-scheme: light;
			--bg: #ffffff;
			--surface: #fafafa;
			--surface-2: #f0f0f0;
			--border: #d2d2f2;
			--fg: #222222;
			--muted: #555555;
			--accent: #222222;
			--accent-2: #222222;
			--orange: #222222;
			--input-bg: #ffffff;
			--focus: #6666aa;
			--btn-bg: #222222;
			--btn-fg: #ffffff;
			--form-shadow: none;
			--field-hover-border: #9999cc;
			--focus-ring: color-mix(in srgb, #6666aa 28%, transparent);
		}
		@media (prefers-color-scheme: dark) {
			:root {
				color-scheme: dark;
				--bg: #272822;
				--surface: #3e3d32;
				--surface-2: #34352f;
				--border: #49483e;
				--fg: #f8f8f2;
				--muted: #75715e;
				--accent: #a6e22e;
				--accent-2: #66d9ef;
				--orange: #fd971f;
				--input-bg: #1e1f1c;
				--focus: #66d9ef;
				--btn-bg: #a6e22e;
				--btn-fg: #1e1f1c;
				--form-shadow: 0 8px 28px rgba(0, 0, 0, .28);
				--field-hover-border: color-mix(in srgb, #66d9ef 45%, #49483e);
				--focus-ring: color-mix(in srgb, #66d9ef 28%, transparent);
			}
		}
		* { box-sizing: border-box; }
		body {
			font-family: Georgia, "Times New Roman", serif;
			max-width: 52rem;
			margin: 2rem auto;
			padding: 0 1rem 3rem;
			line-height: 1.5;
			color: var(--fg);
			background: var(--bg);
		}
		h1 {
			font-weight: 700;
			letter-spacing: -.02em;
			color: var(--accent);
			margin-bottom: .5rem;
		}
		.lead {
			max-width: 42rem;
			color: var(--muted);
			margin-top: 0;
			margin-bottom: 1.75rem;
		}
		form {
			display: flex;
			flex-direction: column;
			gap: 1.25rem;
			padding: 2rem;
			border: 1px solid var(--border);
			background: var(--surface);
			border-radius: 8px;
			box-shadow: var(--form-shadow);
		}
		label {
			font-weight: 600;
			margin-bottom: -.25rem;
			color: var(--accent-2);
		}
		textarea,
		input[type="number"] {
			width: 100%;
			padding: .75rem;
			border: 1px solid var(--border);
			border-radius: 6px;
			font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
			font-size: .95rem;
			color: var(--fg);
			background: var(--input-bg);
			resize: vertical;
			transition: border-color .15s, box-shadow .15s;
		}
		input[type="number"] {
			width: 8rem;
			padding: .5rem .65rem;
			resize: none;
		}
		textarea::placeholder {
			color: var(--muted);
		}
		textarea:hover,
		input[type="number"]:hover {
			border-color: var(--field-hover-border);
		}
		textarea:focus,
		input[type="number"]:focus {
			outline: none;
			border-color: var(--focus);
			box-shadow: 0 0 0 3px var(--focus-ring);
		}
		input[type="range"] {
			width: 100%;
			accent-color: var(--accent);
		}
		button {
			padding: .75rem 1.5rem;
			font-size: 1.05rem;
			font-weight: 600;
			font-family: inherit;
			background: var(--btn-bg);
			color: var(--btn-fg);
			border: none;
			border-radius: 6px;
			cursor: pointer;
			transition: filter .15s, transform .05s;
		}
		button:hover {
			filter: brightness(1.08);
		}
		button:active {
			transform: translateY(1px);
		}
		button:focus-visible {
			outline: 2px solid var(--focus);
			outline-offset: 2px;
		}
		#download {
			display: inline-block;
			margin-top: 1rem;
			padding: .65rem 1.25rem;
			background: var(--surface-2);
			color: var(--orange);
			text-decoration: none;
			border: 1px solid var(--border);
			border-radius: 6px;
			font-weight: 600;
			transition: border-color .15s, background .15s, color .15s;
		}
		#download:hover {
			background: var(--surface);
			border-color: var(--orange);
			color: var(--fg);
		}
		#download:focus-visible {
			outline: 2px solid var(--focus);
			outline-offset: 2px;
		}
	</style>
</head>
<body>

	<h1>Elias sin magiske bingogenerator</h1>
	<p class="lead">Fyll inn én mulighet per linje. Velg rutenettstørrelse og antall bord. Alt blir tilfeldig og unikt per ark – uten duplikater på samme kort.</p>

	<form id="form">
		<!-- 1. Overskrift (toppen av hver side) -->
		<div>
			<label for="headerTemplate">Overskriftsmal (bruk $n for nummer, f.eks. "Bord $n")</label>
			<textarea id="headerTemplate" rows="1">Bryllupsbingo</textarea>
		</div>

		<!-- 2. Underoverskrift (rett under overskriften) -->
		<div>
			<label for="subtitle">Underoverskrift (bruk $n for nummer, f.eks. "Bord $n")</label>
			<textarea id="subtitle" rows="1">Bord $n</textarea>
		</div>

		<!-- 3. Muligheter / rutenett (hovedinnholdet) -->
		<div>
			<label for="things">Muligheter (én per linje – fyller rutenettet)</label>
			<textarea id="things" rows="12" placeholder="Skriv inn ett alternativ per linje her..."></textarea>
		</div>

		<!-- 4. Regler og premier (nederst under rutenettet) -->
		<div>
			<label for="rules">Regler og premier (vises under rutenettet på hvert bord)</label>
			<textarea id="rules" rows="4">Bingo teller horisontalt, vertikalt og diagonalt.
1 rekke = 3. premie – Gullpenger
2 rekker = 2. premie – Twistpose
Fullt brett = 1. premie – valgfri drink til alle på bordet</textarea>
		</div>

		<div>
			<label id="sizePreview" for="size">Størrelse – 1×1</label>
			<input type="range" id="size" min="1" max="1" value="1" step="1">
		</div>

		<div>
			<label for="count">Antall bingoark (bord)</label>
			<input type="number" id="count" value="12" min="1" max="200">
		</div>

		<button type="submit">Generer PDF</button>
	</form>

	<a id="download" href="#" style="display: none;"></a>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
	<script>
		const form = document.getElementById('form');
		const thingsEl = document.getElementById('things');
		const rulesEl = document.getElementById('rules');
		const subtitleEl = document.getElementById('subtitle');
		const headerTemplateEl = document.getElementById('headerTemplate');
		const sizeEl = document.getElementById('size');
		const sizePreview = document.getElementById('sizePreview');
		const countEl = document.getElementById('count');
		const downloadEl = document.getElementById('download');

		// PDF titles are canvas → transparent PNG (jsPDF core fonts can't use these faces).
		// No CSS fallback stack: missing glyphs would otherwise mix Georgia mid-word.
		const PDF_HEADING_FONT = "BingoPdfHeading";
		const PDF_SUBTITLE_FONT = "BingoPdfSubtitle";
		const HEADING_FONT_URL = "resources/fonts/Eyesome-Script.otf";
		const SUBTITLE_FONT_URL = "resources/fonts/CormorantGaramond-Regular.ttf";
		const fontReady = new Map();

		function ensureFont(family, url) {
			if (!fontReady.has(family)) {
				fontReady.set(family, (async () => {
					const face = new FontFace(family, `url(${url})`);
					await face.load();
					document.fonts.add(face);
					await document.fonts.load(`64px "${family}"`);
					if (!document.fonts.check(`64px "${family}"`)) {
						throw new Error(`Font not available for canvas: ${family}`);
					}
				})());
			}
			return fontReady.get(family);
		}

		async function renderTextImage(text, {
			family,
			url,
			fontSizePx = 64,
			paddingX = 28,
			paddingY = 18,
			lineHeight = 1.35,
		}) {
			await ensureFont(family, url);

			const scale = 3;
			const canvas = document.createElement("canvas");
			const ctx = canvas.getContext("2d");
			const fontSpec = `${fontSizePx}px "${family}"`;

			ctx.font = fontSpec;
			const metrics = ctx.measureText(text);
			const widthPx = Math.ceil(metrics.width + paddingX * 2);
			const heightPx = Math.ceil(fontSizePx * lineHeight + paddingY * 2);

			canvas.width = widthPx * scale;
			canvas.height = heightPx * scale;
			// Transparent PNG: JPEG-on-white left a faint grey plate on the page.
			ctx.setTransform(1, 0, 0, 1, 0, 0);
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			ctx.scale(scale, scale);
			ctx.font = fontSpec;
			ctx.fillStyle = "#000000";
			ctx.textAlign = "center";
			ctx.textBaseline = "middle";
			ctx.fillText(text, widthPx / 2, heightPx / 2);

			return {
				dataUrl: canvas.toDataURL("image/png"),
				widthPx,
				heightPx,
			};
		}

		function drawCenteredImage(doc, image, pageWidth, y, maxWidthMm, pxToMm = 0.35) {
			const widthMm = Math.min(maxWidthMm, image.widthPx * pxToMm);
			const heightMm = widthMm * (image.heightPx / image.widthPx);
			const x = (pageWidth - widthMm) / 2;
			doc.addImage(image.dataUrl, "PNG", x, y, widthMm, heightMm);
			return y + heightMm;
		}

		function negotiate(evt) {
			const text = thingsEl.value.trim();
			const items = text
				? text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0)
				: [];
			const numItems = items.length;

			let maxS = 1;
			if (numItems > 0) {
				maxS = Math.floor(Math.sqrt(numItems));
				if (maxS < 1) maxS = 1;
			}

			sizeEl.min = "1";
			sizeEl.max = String(maxS);

			const isThingsInput = evt && evt.target === thingsEl;
			let current = parseInt(sizeEl.value, 10) || 1;

			if (isThingsInput || current > maxS) {
				current = maxS;
			}
			sizeEl.value = current;

			if (numItems === 0) {
				sizePreview.textContent = "Størrelse – 1×1 (legg inn muligheter for å justere)";
			} else {
				sizePreview.textContent = `Størrelse – ${current}×${current} (${current * current} ruter, ${numItems} muligheter tilgjengelig)`;
			}
		}

		async function submit(evt) {
			evt.preventDefault();

			const text = thingsEl.value.trim();
			let items = text
				? text.split(/\r?\n/).map(l => l.trim()).filter(Boolean)
				: [];

			if (items.length === 0) {
				alert("Vennligst fyll inn noen muligheter først.");
				return;
			}

			const size = parseInt(sizeEl.value, 10);
			const count = parseInt(countEl.value, 10) || 1;
			const cellsPerCard = size * size;
			const rulesText = rulesEl.value.trim();
			const subtitleTemplate = subtitleEl.value.trim() || "Bord $n";
			const headerTemplate = headerTemplateEl.value.trim() || "Bryllupsbingo";

			if (cellsPerCard > items.length) {
				alert(`For få muligheter. Du trenger minst ${cellsPerCard} for et ${size}×${size}-rutenett.`);
				return;
			}

			if (typeof window.jspdf === "undefined" || !window.jspdf.jsPDF) {
				alert("jsPDF-biblioteket ble ikke lastet. Sjekk internettforbindelsen eller prøv på nytt.");
				return;
			}

			const { jsPDF } = window.jspdf;
			const doc = new jsPDF({
				orientation: "portrait",
				unit: "mm",
				format: "a4"
			});

			const pageWidth = doc.internal.pageSize.getWidth();
			const pageHeight = doc.internal.pageSize.getHeight();
			const margin = 14;
			const contentWidth = pageWidth - margin * 2;
			const textImageCache = new Map();

			async function cachedTextImage(key, factory) {
				if (!textImageCache.has(key)) {
					textImageCache.set(key, await factory());
				}
				return textImageCache.get(key);
			}

			for (let c = 0; c < count; c++) {
				if (c > 0) doc.addPage();

				// Overskrift med mal (erstatt $n med nummer) — Eyesome Script
				const headerText = headerTemplate.replace(/\$n/g, String(c + 1));
				let headingImage;
				try {
					headingImage = await cachedTextImage(`h:${headerText}`, () =>
						renderTextImage(headerText, {
							family: PDF_HEADING_FONT,
							url: HEADING_FONT_URL,
							fontSizePx: 72,
							paddingX: 32,
							paddingY: 20,
							lineHeight: 1.4,
						})
					);
				} catch (error) {
					alert("Kunne ikke tegne overskriften. Sjekk at fontfilen finnes og prøv på nytt.");
					return;
				}
				const headingBottom = drawCenteredImage(
					doc, headingImage, pageWidth, margin - 2, contentWidth, 0.32
				);

				// Underoverskrift (samme $n-mal) — Cormorant Garamond serif
				const subtitleText = subtitleTemplate.replace(/\$n/g, String(c + 1));
				let subtitleImage;
				try {
					subtitleImage = await cachedTextImage(`s:${subtitleText}`, () =>
						renderTextImage(subtitleText, {
							family: PDF_SUBTITLE_FONT,
							url: SUBTITLE_FONT_URL,
							fontSizePx: 36,
							paddingX: 20,
							paddingY: 10,
							lineHeight: 1.25,
						})
					);
				} catch (error) {
					alert("Kunne ikke tegne underoverskriften. Sjekk at fontfilen finnes og prøv på nytt.");
					return;
				}
				const subtitleTop = headingBottom + 1;
				const subtitleBottom = drawCenteredImage(
					doc, subtitleImage, pageWidth, subtitleTop, contentWidth * 0.7, 0.28
				);

				// Velg tilfeldige, unike alternativer til dette kortet
				const shuffled = [...items].sort(() => Math.random() - 0.5);
				const selected = shuffled.slice(0, cellsPerCard);

				// Bygg rutenett
				const grid = [];
				for (let i = 0; i < size; i++) {
					grid.push(selected.slice(i * size, (i + 1) * size));
				}

				// Beregn plassering og størrelse på rutenettet (kvadratiske celler)
				const gridTop = subtitleBottom + 8;
				const availableWidth = pageWidth - margin * 2;
				// Reserve space for the rules box (top margin + padding + text).
				const rulesAreaHeight = 55;
				const maxGridHeight = pageHeight - gridTop - margin - rulesAreaHeight;
				const maxCellSize = 26;
				const cellSize = Math.min(
					availableWidth / size,
					maxGridHeight / size,
					maxCellSize
				);
				const gridWidth = cellSize * size;
				const gridLeft = margin + (availableWidth - gridWidth) / 2;

				// Fontstørrelse tilpasset rutenett
				let fontSize = 9.5;
				if (size >= 5) fontSize = 7.5;
				if (size >= 7) fontSize = 6;
				doc.setFontSize(fontSize);

				for (let row = 0; row < size; row++) {
					for (let col = 0; col < size; col++) {
						const x = gridLeft + col * cellSize;
						const y = gridTop + row * cellSize;

						// Cellekant
						doc.setDrawColor(80);
						doc.rect(x, y, cellSize, cellSize);

						// Tekst, sentrert og automatisk linjebryt
						const cellText = grid[row][col];
						const lines = doc.splitTextToSize(cellText, cellSize - 5);

						const textHeight = lines.length * (fontSize * 0.38);
						const textY = y + (cellSize - textHeight) / 2 + fontSize * 0.32;

						doc.setFont("helvetica", "normal");
						doc.setTextColor(30, 30, 30);
						doc.text(lines, x + cellSize / 2, textY, {
							align: "center",
							maxWidth: cellSize - 5
						});
					}
				}

				// Regler / premier: centered ~50% width, left-aligned copy, soft gray plate
				if (rulesText) {
					const rulesTopMargin = 18;
					const rulesBoxWidth = availableWidth * 0.5;
					const rulesPadX = 12;
					const rulesPadY = 12;
					const lineHeight = 3.6;
					const blockGap = 1.6;
					const firstBaseline = 2.9;
					const rulesBoxLeft = margin + (availableWidth - rulesBoxWidth) / 2;
					const rulesBoxTop = gridTop + size * cellSize + rulesTopMargin;
					const textMaxWidth = rulesBoxWidth - rulesPadX * 2;

					doc.setFont("helvetica", "normal");
					doc.setFontSize(8);

					const ruleLines = rulesText.split(/\r?\n/).filter(l => l.trim().length > 0);
					const wrappedBlocks = ruleLines.map(line =>
						doc.splitTextToSize(line.trim(), textMaxWidth)
					);
					if (wrappedBlocks.length > 0) {
						let textRun = 0;
						wrappedBlocks.forEach((wrapped, i) => {
							textRun += wrapped.length * lineHeight;
							if (i < wrappedBlocks.length - 1) textRun += blockGap;
						});
						// Top pad + first baseline + remaining lines + bottom pad
						const rulesBoxHeight =
							rulesPadY + firstBaseline + (textRun - lineHeight) + rulesPadY + 1.2;

						doc.setFillColor(246, 246, 246);
						doc.roundedRect(
							rulesBoxLeft,
							rulesBoxTop,
							rulesBoxWidth,
							rulesBoxHeight,
							2,
							2,
							"F"
						);

						doc.setTextColor(55, 55, 55);
						let currentY = rulesBoxTop + rulesPadY + firstBaseline;
						for (const wrapped of wrappedBlocks) {
							doc.text(wrapped, rulesBoxLeft + rulesPadX, currentY, { align: "left" });
							currentY += wrapped.length * lineHeight + blockGap;
						}
					}
				}
			}

			// Lag nedlastbar PDF
			const pdfBlob = doc.output("blob");
			const url = URL.createObjectURL(pdfBlob);

			downloadEl.href = url;
			downloadEl.download = `bingo_bord_${new Date().toISOString().slice(0, 10)}.pdf`;
			downloadEl.style.display = "inline-block";
			downloadEl.textContent = `Last ned PDF (${count} bord • ${size}×${size})`;
		}

		// Koble til hendelser
		form.addEventListener("input", negotiate);
		form.addEventListener("submit", submit);

		// Initialiser forhåndsvisning
		negotiate();
	</script>

</body>
</html>
